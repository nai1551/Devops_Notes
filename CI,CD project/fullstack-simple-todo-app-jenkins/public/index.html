<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Simple Todo App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>My Todos</h1>

    <form id="todo-form">
      <input
        type="text"
        id="todo-input"
        placeholder="What needs doing?"
        autocomplete="off"
        required
      />
      <button type="submit">Add</button>
    </form>

    <ul id="todo-list"></ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
